name: Feature request
description: 提议一个明确的用户能力或流程改进
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请从实际使用问题出发描述需求，而不是只写一个技术名词。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 当前在哪个流程中浪费时间、容易出错或无法完成？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的最小解决方案
      description: 描述完成后用户能够做什么。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要涉及模块
      options:
        - 素材与任务
        - 转写
        - AI 选片
        - 审核与切片
        - 字幕
        - 内容准备
        - 排期
        - 抖音 / B站发布
        - 安装与配置
        - 文档与界面
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
      description: 当前是否通过手工步骤或其他工具解决？

  - type: checkboxes
    id: boundary
    attributes:
      label: 项目边界
      options:
        - label: 该需求不依赖绕过验证码、登录验证、平台风控或访问控制。
          required: true
        - label: 我理解路线图不代表固定交付日期。
          required: true

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Python 编译检查
        run: python -m compileall app scripts

      - name: Ruff 代码检查
        run: ruff check app tests scripts/seed_demo_data.py scripts/backup_restore.py scripts/backup_restore_runtime.py

      - name: JavaScript 语法检查
        run: find app/static/js -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: PowerShell 脚本语法检查
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("{0}: {1}" -f $_.Name, ($errors.Message -join '; '))
            }
          }
          if ($failed) { exit 1 }

      - name: Docker Compose 配置检查
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet

      - name: 敏感文件检查
        run: |
          blocked="$(git ls-files | grep -Ei '(^|/)(\.env|cookies.*\.json|.*storage-state.*\.json|.*\.sqlite3|.*\.db|publish_worker_.*\.log|niuma-studio-.*\.zip|acceptance-results/.*)$' || true)"
          if [ -n "$blocked" ]; then
            echo "检测到不应提交的敏感或运行时文件："
            echo "$blocked"
            exit 1
          fi

      - name: 隔离 Demo 建库检查
        env:
          DEMO_MODE: "true"
          DATA_DIR: /tmp/niuma-demo-data
          DATABASE_PATH: /tmp/niuma-demo-data/workflow.sqlite3
          STORAGE_ROOT: /tmp/niuma-demo-storage
          TASKS_DIR: /tmp/niuma-demo-storage
          UPLOAD_TEMP_DIR: /tmp/niuma-demo-storage/_temp
          PUBLISH_SCHEDULER_ENABLED: "false"
        run: |
          python -m scripts.seed_demo_data --reset
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('/tmp/niuma-demo-data/workflow.sqlite3')
          assert db.execute("select count(*) from tasks where id like 'demo_%'").fetchone()[0] == 3
          assert db.execute("select count(*) from clip_candidates where id like 'demo_%'").fetchone()[0] == 6
          assert db.execute("select count(*) from publish_jobs where id like 'demo_%'").fetchone()[0] == 6
          print('demo database verified')
          PY

      - name: 备份恢复与 WAL 快照检查
        run: pytest tests/test_backup_restore.py tests/test_backup_restore_wal.py -v

      - name: 运行测试
        run: pytest -v

  windows-host-smoke:
    name: Windows host smoke test
    needs: lint-and-test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Windows 主机冒烟
        shell: pwsh
        run: .\scripts\windows_ci_smoke.ps1

      - name: 上传 Windows 冒烟证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-smoke-${{ github.run_id }}
          path: acceptance-results/windows-ci
          if-no-files-found: warn
          retention-days: 14

  docker-image-smoke:
    name: Docker image smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建正式镜像
        run: docker build --tag niuma-studio:ci .

      - name: 启动隔离 Demo 容器
        run: |
          docker run --detach \
            --name niuma-studio-ci \
            --publish 127.0.0.1:8001:8001 \
            --env DEMO_MODE=true \
            --env DATA_DIR=/app/ci-data \
            --env DATABASE_PATH=/app/ci-data/workflow.sqlite3 \
            --env STORAGE_ROOT=/app/ci-tasks \
            --env TASKS_DIR=/app/ci-tasks \
            --env UPLOAD_TEMP_DIR=/app/ci-tasks/_temp \
            --env NIUMA_TRUST_DOCKER_LOOPBACK_PROXY=true \
            --env PUBLISH_SCHEDULER_ENABLED=false \
            niuma-studio:ci

      - name: 等待健康检查
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs niuma-studio-ci
          exit 1

      - name: 写入并验证 Demo 数据
        run: |
          docker exec niuma-studio-ci python -m scripts.seed_demo_data --reset
          docker exec niuma-studio-ci python -c "import sqlite3; db=sqlite3.connect('/app/ci-data/workflow.sqlite3'); assert db.execute(\"select count(*) from tasks where id like 'demo_%'\").fetchone()[0] == 3; assert db.execute(\"select count(*) from clip_candidates where id like 'demo_%'\").fetchone()[0] == 6; assert db.execute(\"select count(*) from publish_jobs where id like 'demo_%'\").fetchone()[0] == 6"

      - name: 验证主要页面
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8001/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8001/tasks >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8001/clips >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8001/publish >/dev/null

      - name: 输出失败日志
        if: failure()
        run: docker logs niuma-studio-ci || true

      - name: 清理容器
        if: always()
        run: docker rm --force niuma-studio-ci || true

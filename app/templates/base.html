<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='img/brand/niuma-studio-favicon.ico') }}?v=20260604-favicon" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='img/brand/niuma-studio-favicon-32.png') }}?v=20260604-favicon">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='img/brand/niuma-studio-apple-touch-icon.png') }}?v=20260604-favicon">
    <meta name="theme-color" content="#256fff">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=20260606-ai-interface">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/">
          <span class="brand-mark">
            <img src="{{ url_for('static', path='img/brand/niuma-studio-logo.png') }}" alt="">
          </span>
          <span>
            <strong>{{ settings.app_name_cn }}</strong>
            <small>本地 AI 高光生产后台</small>
          </span>
        </a>
        <nav class="side-nav" aria-label="主导航">
          <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="/"><span class="nav-dot"></span>工作台</a>
          <a class="{{ 'active' if active_page == 'new_task' else '' }}" href="/tasks/new"><span class="nav-dot"></span>新建任务</a>
          <a class="{{ 'active' if active_page == 'tasks' else '' }}" href="/tasks"><span class="nav-dot"></span>任务列表</a>
          <a class="{{ 'active' if active_page == 'clips' else '' }}" href="/clips"><span class="nav-dot"></span>片段审核</a>
          <a class="{{ 'active' if active_page == 'subtitles' else '' }}" href="/subtitles"><span class="nav-dot"></span>字幕推送</a>
          <a class="{{ 'active' if active_page == 'publish' else '' }}" href="/publish"><span class="nav-dot"></span>发送中心</a>
          <a class="{{ 'active' if active_page == 'system' else '' }}" href="/system"><span class="nav-dot"></span>系统状态</a>
        </nav>
        <div class="sidebar-note">
          <strong>v1.1 本地切片全流程</strong>
        <span>上传、转写、AI 分析、人工审核和自动切片已走通；发送中心使用 opencli 逐条投稿到抖音和 B站。</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-box">
            <span class="search-mark"></span>
            <input type="search" placeholder="任务名称、平台、状态">
          </div>
          <div class="topbar-actions">
            <span class="notice-dot" aria-label="通知"></span>
            <span class="user-chip">张小明</span>
            <a class="primary-button" href="/tasks/new">新建任务</a>
          </div>
        </header>

        {% block content %}{% endblock %}
      </main>
    </div>

    {% block extra_scripts %}{% endblock %}
    <script src="{{ url_for('static', path='js/app.js') }}?v=20260606-ai-interface"></script>
  </body>
</html>

{# Essential shared helpers travel with the document, before optional page scripts. #}
<script>
window.apiFetch = async function apiFetch(url, options = {}) {
  const requestOptions = { ...options };
  const headers = new Headers(options.headers || {});
  if (options.body && !(options.body instanceof FormData) && !headers.has("Content-Type")) {
    headers.set("Content-Type", "application/json");
  }
  requestOptions.headers = headers;
  const response = await fetch(url, requestOptions);
  let data = {};
  try {
    data = await response.json();
  } catch (_error) {
    data = {};
  }
  if (!response.ok) {
    const detail = data.detail;
    const message = typeof detail === "object" && detail
      ? (detail.message || data.message || `请求失败（HTTP ${response.status}）`)
      : (detail || data.message || `请求失败（HTTP ${response.status}）`);
    const error = new Error(message);
    error.status = response.status;
    error.details = typeof detail === "object" && detail ? detail : null;
    throw error;
  }
  return data;
};
window.preferredScrollBehavior = function preferredScrollBehavior() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
};
</script>

{% macro production_config(content_profiles, prompt_presets, settings, mode='upload', candidate_count_options=[], challenger_trial=none) %}
<div class="production-config" data-production-config="{{ mode }}">
  <label>内容类型<select class="control" {% if mode == 'upload' %}id="selection-profile"{% endif %} name="selection_profile" required>
    {% if not challenger_trial %}<option value="" selected disabled>请选择内容类型</option>{% endif %}
    {% for profile in content_profiles %}<option value="{{ profile.id }}" data-prompt="{{ profile.prompt_preset_id }}" data-rules="{{ profile.rules_version }}">{{ profile.name }}{{ ' · 试用' if profile.id in ['interview_story','knowledge_opinion'] else '' }}</option>{% endfor %}
  </select>{% if mode == 'upload' %}<span class="form-hint" id="selection-profile-hint">按素材选择内容类型，查看推荐片长与选片规则。</span>{% endif %}</label>
  <div class="form-row production-targets">
    <label>目标成片数<input class="control" name="final_clip_target" type="number" min="1" max="12" value="5" required><span class="form-hint">质量不足时允许少于目标数量。</span></label>
    <label>单条最长（分钟）<input class="control" name="max_clip_duration" type="number" min="1" max="60" value="10" required>{% if mode == 'upload' %}<span class="form-hint" id="profile-duration-hint">按内容完整度选片，保留模板硬边界。</span>{% endif %}</label>
  </div>
  <label>字幕处理<select class="control" name="subtitle_strategy" aria-describedby="{{ 'new-task' if mode == 'upload' else 'batch' }}-subtitle-help"><option value="original">保留原视频字幕</option><option value="review">新增字幕 · 审核后使用</option></select><span id="{{ 'new-task' if mode == 'upload' else 'batch' }}-subtitle-help" class="form-hint">保留原画面不烧录新增字幕；语音转写仍用于 AI 选片。新增字幕会进入字幕审核。</span></label>
    {% if mode == 'upload' %}<div class="form-row" id="long-live-settings" hidden><label>长直播每小时密度<input class="control" name="highlight_density_per_hour" type="number" min="1" max="10" value="4"></label><label>长直播候选总上限<input class="control" name="highlight_total_limit" type="number" min="1" max="50" value="30"></label></div>{% endif %}
  <details class="production-advanced material-advanced"><summary>高级设置 <span>制作方案、AI 与候选参数</span></summary><div class="production-advanced-fields material-advanced-fields">
    <label>制作方案<select class="control" {% if mode == 'upload' %}id="new-task-prompt"{% endif %} name="ai_prompt_preset_id" required>{% for preset in prompt_presets %}<option value="{{ preset.id }}">{{ preset.name }}</option>{% endfor %}</select><span class="form-hint">选用已有方案；共享方案在<a href="/system?tab=plans">设置</a>中编辑。</span></label>
    <label>AI 服务<select class="control" {% if mode == 'upload' %}id="new-task-provider"{% endif %} name="ai_provider">{% for provider,label in [('codex','Codex CLI'),('remote','远程 AI'),('local','本地 AI')] %}<option value="{{ provider }}" {{ 'selected' if settings.ai_default_provider == provider else '' }}>{{ label }}</option>{% endfor %}</select></label>
    {% if mode == 'batch' %}<label>AI 分析流程<select class="control" name="analysis_mode"><option value="staged_v1">分段分析</option><option value="codex_full_transcript_v1">Codex 全文一次分析</option></select><small class="form-hint">全文模式适用于 Codex 棚内综艺播放目标 v1，须关闭视觉辅助。</small></label>{% endif %}
    <label>候选池上限{% if mode == 'upload' %}<select class="control" name="candidate_clip_count">{% for option in candidate_count_options %}<option value="{{ option }}" {{ 'selected' if option == 12 else '' }}>{{ option }} 条</option>{% endfor %}</select>{% else %}<input class="control" name="candidate_clip_count" type="number" min="1" max="50" value="12" required>{% endif %}<span class="form-hint">供审片的候选数量，不等于成片数量。</span></label>
    {% if mode == 'batch' %}<label>长直播每小时密度<input class="control" name="highlight_density_per_hour" type="number" min="1" max="10" value="4" required></label>{% endif %}
    <label class="checkbox-row material-check"><input name="visual_enabled" type="checkbox" value="true"><span>候选画面辅助验证 · 试用<small class="form-hint">增加关键帧核验；不可用时降级保留文字与音频结果。</small></span></label>
  </div></details>
</div>
{% endmacro %}

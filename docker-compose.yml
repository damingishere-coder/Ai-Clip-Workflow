name: niuma-studio

services:
  workflow:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: niuma-studio:latest
    container_name: niuma-studio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      NIUMA_TRUST_DOCKER_LOOPBACK_PROXY: "true"
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/workflow.sqlite3
      STORAGE_ROOT: /workspace/tasks
      TASKS_DIR: /workspace/tasks
      UPLOAD_TEMP_DIR: /workspace/tasks/_临时上传
      AI_LOCAL_BASE_URL: http://host.docker.internal:11434/v1
      OPENCLI_LOCAL_BASE_URL: http://127.0.0.1:8001
      OPENCLI_HOST_BRIDGE_URL: http://host.docker.internal:8765
      APP_TIMEZONE: Asia/Shanghai
      PUBLISH_DEFAULT_MODE: local_browser
      PUBLISH_SCHEDULER_INTERVAL_SECONDS: 5
      PUBLISH_SCHEDULER_EXPORT_DIR: /workspace/tasks/_发布包
      PUBLISH_WORKER_URL: http://host.docker.internal:8765
      PUBLISH_WORKER_TOKEN: ${PUBLISH_WORKER_TOKEN:-}
      PUBLISH_ENABLE_OPENCLI_FALLBACK: ${PUBLISH_ENABLE_OPENCLI_FALLBACK:-false}
      TRANSCRIPTION_DEVICE: cpu
      TRANSCRIPTION_COMPUTE_TYPE: int8
    volumes:
      - ./data:/app/data
      - "${NIUMA_STORAGE_PATH:-E:/直播间切片工作流存储}:/workspace/tasks"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

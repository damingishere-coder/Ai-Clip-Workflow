name: niuma-studio

services:
  workflow:
    build: .
    image: niuma-studio:latest
    container_name: niuma-studio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/app --reload-dir /app/prompts
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/workflow.sqlite3
      STORAGE_ROOT: /workspace/tasks
      TASKS_DIR: /workspace/tasks
      AI_LOCAL_BASE_URL: http://host.docker.internal:11434/v1
      OPENCLI_LOCAL_BASE_URL: http://127.0.0.1:8001
      OPENCLI_HOST_BRIDGE_URL: http://host.docker.internal:8765
      APP_TIMEZONE: Asia/Shanghai
      PUBLISH_DEFAULT_MODE: local_browser
      PUBLISH_SCHEDULER_INTERVAL_SECONDS: 5
      PUBLISH_WORKER_URL: http://host.docker.internal:8765
      PUBLISH_WORKER_TOKEN: ${PUBLISH_WORKER_TOKEN:-}
      PUBLISH_ENABLE_OPENCLI_FALLBACK: ${PUBLISH_ENABLE_OPENCLI_FALLBACK:-false}
      TRANSCRIPTION_DEVICE: cpu
      TRANSCRIPTION_COMPUTE_TYPE: int8
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts
      - ./data:/app/data
      - E:/直播间切片工作流存储:/workspace/tasks
    restart: unless-stopped

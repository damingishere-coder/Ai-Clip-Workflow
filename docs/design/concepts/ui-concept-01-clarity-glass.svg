  <g class="body">
    <path d="M326 542H960" stroke="#edf1f7"/>
    <text x="326" y="578">康熙来了 2016 高光</text><text x="560" y="578">通用</text><rect x="682" y="556" width="74" height="28" rx="14" fill="#eaf2ff"/><text x="719" y="575" text-anchor="middle" font-size="12" font-weight="800" fill="#1f6fff">待审核</text><text x="820" y="578">12 条</text>
    <path d="M326 606H960" stroke="#edf1f7"/>
    <text x="326" y="642">新品直播复盘 0612</text><text x="560" y="642">抖音</text><rect x="682" y="620" width="74" height="28" rx="14" fill="#fff2dd"/><text x="719" y="639" text-anchor="middle" font-size="12" font-weight="800" fill="#d98724">处理中</text><text x="820" y="642">8 条</text>
    <path d="M326 670H960" stroke="#edf1f7"/>
    <text x="326" y="706">访谈长视频切片</text><text x="560" y="706">B站</text><rect x="682" y="684" width="74" height="28" rx="14" fill="#e5f8f0"/><text x="719" y="703" text-anchor="middle" font-size="12" font-weight="800" fill="#20a06b">已切片</text><text x="820" y="706">6 条</text>
  </g>

  <rect x="1016" y="430" width="396" height="520" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="1048" y="478" class="h2">工作流状态</text>

    <text x="22" y="27" class="small" fill="#1f6fff">台</text><text x="58" y="27" font-size="15" font-weight="800" fill="#1f6fff">工作台</text>
    <text x="22" y="82" class="small">建</text><text x="58" y="82" font-size="15" font-weight="760" fill="#344054">新建任务</text>
    <text x="22" y="137" class="small">列</text><text x="58" y="137" font-size="15" font-weight="760" fill="#344054">任务列表</text>

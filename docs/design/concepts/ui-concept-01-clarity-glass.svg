  <text x="1072" y="694" class="small">正在准备进入 AI 分析</text>
  <rect x="1048" y="728" width="332" height="72" rx="18" fill="#f4f8fd"/>
  <text x="1072" y="758" font-size="16" font-weight="850" fill="#111827">今日重点</text>
  <text x="1072" y="782" class="small">8 条任务等待人工审核</text>

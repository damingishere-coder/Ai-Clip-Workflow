<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e8f0fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c9cff"/>
      <stop offset="1" stop-color="#1f6fff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#203a5f" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:800 42px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}
      .h2{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}
      .body{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#667085}
      .small{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#667085}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f6fff;letter-spacing:.08em}
      .num{font:850 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}
      .label{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#7a8699}
    </style>
  </defs>
  <rect width="1440" height="1024" fill="url(#bg)"/>
  <g opacity=".22" stroke="#1f6fff" stroke-width="1">
    <path d="M0 96H1440M0 192H1440M0 288H1440M0 384H1440M0 480H1440M0 576H1440M0 672H1440M0 768H1440M0 864H1440"/>
    <path d="M96 0V1024M192 0V1024M288 0V1024M384 0V1024M480 0V1024M576 0V1024M672 0V1024M768 0V1024M864 0V1024M960 0V1024M1056 0V1024M1152 0V1024M1248 0V1024M1344 0V1024"/>
  </g>

  <rect x="28" y="28" width="238" height="968" rx="24" fill="#ffffff" opacity=".78" filter="url(#shadow)"/>
  <rect x="52" y="56" width="44" height="44" rx="14" fill="url(#blue)"/>
  <text x="74" y="85" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">牛</text>

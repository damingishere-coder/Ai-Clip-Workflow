    <path d="M22 18H300" stroke="#dbe5f2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="18" r="18" fill="#20a06b"/><text x="22" y="24" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">1</text>
    <circle cx="92" cy="18" r="18" fill="#20a06b"/><text x="92" y="24" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">2</text>
    <circle cx="162" cy="18" r="18" fill="#1f6fff"/><text x="162" y="24" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">3</text>
    <circle cx="232" cy="18" r="18" fill="#edf2f8"/><text x="232" y="24" text-anchor="middle" font-size="13" font-weight="900" fill="#7a8699">4</text>
    <circle cx="302" cy="18" r="18" fill="#edf2f8"/><text x="302" y="24" text-anchor="middle" font-size="13" font-weight="900" fill="#7a8699">5</text>
